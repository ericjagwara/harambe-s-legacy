[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serve the app for every page path, so /results or /register opened directly or shared as a link loads correctly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The partner MOU page is unlisted too.
[[headers]]
  for = "/partner-mou"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The resource mobiliser MOU page is unlisted too.
[[headers]]
  for = "/mobiliser-mou"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The volunteer agreement page is unlisted: keep it out of search engines.
[[headers]]
  for = "/volunteer-agreement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Partner hub pages are for sharing links, not for search results.
[[headers]]
  for = "/hubs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The private dashboard must never be indexed.
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
